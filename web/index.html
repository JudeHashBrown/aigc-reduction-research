<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 写作特征诊断</title>
<style>
:root{
  --bg:#fafaf9; --panel:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e6e3dd;
  --hi:#c0392b; --md:#b8860b; --lo:#4a7c59; --accent:#2d5f8a;
  --hi-bg:#fdecea; --md-bg:#fdf6e3; --lo-bg:#eef6f0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#17161a; --panel:#1f1e23; --ink:#eceaf0; --muted:#9a96a3; --line:#33313a;
  --hi:#ff8a7a; --md:#e0b64a; --lo:#7fc99a; --accent:#7fb3e0;
  --hi-bg:#3a1f1c; --md-bg:#332a13; --lo-bg:#1c2f24;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
  align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px}
.wrap{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.25fr);
  gap:18px;padding:18px 24px;align-items:start}
@media(max-width:960px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em}
textarea{width:100%;min-height:340px;padding:13px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;
  font:14px/1.8 ui-monospace,"SF Mono",Menlo,"PingFang SC",monospace}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:9px;margin-top:11px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:.12s}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:550}
button.primary:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:9px;margin-bottom:15px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:center}
.stat .n{font-size:21px;font-weight:660;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);margin-top:3px}
.n.hi{color:var(--hi)}.n.md{color:var(--md)}.n.lo{color:var(--lo)}
#doc{line-height:2.25;white-space:pre-wrap;word-break:break-word;font-size:14.5px;
  max-height:52vh;overflow:auto;padding:4px 2px}
mark{background:none;padding:1px 0;border-radius:2px;cursor:pointer;
  border-bottom:2px solid;transition:background .1s}
mark.s-high{border-color:var(--hi)} mark.s-medium{border-color:var(--md)} mark.s-low{border-color:var(--lo)}
mark.s-high:hover,mark.sel.s-high{background:var(--hi-bg)}
mark.s-medium:hover,mark.sel.s-medium{background:var(--md-bg)}
mark.s-low:hover,mark.sel.s-low{background:var(--lo-bg)}
.f{border-left:3px solid var(--line);padding:9px 0 9px 12px;margin-bottom:10px}
.f.high{border-color:var(--hi)}.f.medium{border-color:var(--md)}.f.low{border-color:var(--lo)}
.f .t{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.f .id{font:11.5px ui-monospace,Menlo,monospace;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.f .m{margin:5px 0;font-size:14px;background:var(--bg);padding:6px 9px;border-radius:5px;
  border:1px solid var(--line)}
.f .e{font-size:12.5px;color:var(--muted);line-height:1.6}
.para{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:6px;
  cursor:pointer;font-size:13px;border:1px solid transparent}
.para:hover{border-color:var(--line);background:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.high{background:var(--hi)}.dot.medium{background:var(--md)}.dot.low{background:var(--lo)}
.para .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;
  color:var(--muted);flex:0 0 auto}
.warn{background:var(--hi-bg);border:1px solid var(--hi);border-radius:7px;
  padding:10px 13px;margin-bottom:13px;font-size:13px}
.warn b{color:var(--hi)}
.warn ul{margin:7px 0 0;padding-left:19px} .warn li{margin:3px 0}
.mt{font-size:12.5px;color:var(--muted);line-height:1.9;font-variant-numeric:tabular-nums}
.mt b{color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);
  margin-top:14px;padding-top:11px;line-height:1.7}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{padding:7px 13px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;color:var(--muted)}
.tab.on{border-color:var(--accent);color:var(--ink);font-weight:550}
.empty{color:var(--muted);text-align:center;padding:46px 20px;font-size:13.5px;line-height:1.9}
.diffbox{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:11px;
  font:13px/1.9 ui-monospace,Menlo,"PingFang SC",monospace;white-space:pre-wrap;
  max-height:340px;overflow:auto}
.lg{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);
  margin-right:6px;vertical-align:middle;transition:background .2s}
.led.up{background:var(--lo)} .led.down{background:var(--hi);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
#conn{cursor:default}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
  .upl{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:7px;
       cursor:pointer;font-size:13px;background:var(--btn,transparent)}
  .upl:hover{border-color:var(--accent,#888)}
  .notice{margin:8px 0 0;padding:9px 11px;border-radius:7px;font-size:13px;line-height:1.6}
  .notice.warn{background:#fff6e5;border:1px solid #f0d090;color:#6a4a00}
  .notice.info{background:#eef4fb;border:1px solid #c5d8ee;color:#2c4a6b}
  @media (prefers-color-scheme:dark){
    .notice.warn{background:#3a2e10;border-color:#6b5520;color:#f0d79a}
    .notice.info{background:#16283a;border-color:#2d4a66;color:#a8c8e8}
  }
</style></head><body>

<header>
  <h1>AI 写作特征诊断</h1>
  <span class="sub">中英双语 · 逐句归因 · 规则与统计，零模型</span>
  <span class="sub" id="cal" style="margin-left:auto"></span>
  <span class="sub" id="conn"><i class="led"></i><span id="connTxt">检查中…</span></span>
</header>

<div class="wrap">
  <div class="card">
    <h2>输入</h2>
    <textarea id="in" placeholder="粘贴论文段落（支持中英混排，如中文正文 + 英文摘要）…&#10;&#10;按 ⌘/Ctrl + Enter 直接诊断"></textarea>
    <div class="row">
      <button class="primary" id="btn">诊断</button>
      <button id="fix" disabled>确定性修复</button>
      <button id="rw" disabled title="需配置 LLM">两层改写</button>
      <button id="demo">示例</button>
      <label class="upl" for="file">上传 .docx</label>
      <input type="file" id="file" accept=".docx" hidden>
      <button id="exp" hidden title="把当前文本写回原 docx，保留全部格式">导出 docx</button>
      <span class="hint" id="cnt">0 字</span>
    </div>
    <div id="notices"></div>
    <div id="docinfo" class="note" hidden></div>
    <div class="note">
      <b>两层改写</b> = 代码修复 + LLM 重写结构（需配置 LLM）。
      <b>确定性修复</b>只做不需要语义理解的改动（删套话、换词表内高频词、去格式残留），
      纯代码、毫秒级、结果可复现。<b>不经过任何模型</b>，因此不会反向注入 AI 统计特征。
      需要理解语义的改写（拆编号排比、补主语、空泛句具体化）不在此列。
    </div>
  </div>

  <div class="card" id="out">
    <div class="empty">左侧粘贴文本，点「诊断」。<br>每一条结论都会指出命中的原文和理由，你可以自己核对。</div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), inp=$('#in');
let cur=null, curText='';

const DEMO=`本文深入探讨了图神经网络在交通流量预测中的应用，系统梳理了相关研究。研究表明，该方法发挥着至关重要的作用，从而彰显了其应用价值。综上所述，本研究具有重要的理论意义和实践价值。

Abstract: This paper delves into the application of graph neural networks for traffic flow prediction. The proposed framework serves as a pivotal tool, showcasing robust performance. Studies show that our approach is not just accurate, but also efficient, scalable, and interpretable, underscoring the importance of spatial-temporal modeling. In conclusion, despite these challenges, future research will explore this promising realm.

我们在 PeMS04 上训练，输入 12 个时间步，batch size 64。MAE 从基线的 21.3 降到 19.8，提升幅度不大。按传感器重新划分后掉到 20.6，这个数才可信。`;

let CFG={llm_configured:false}, ONLINE=null;

// 持续监测后端。页面可能开了很久，而服务早已停掉——
// 只在加载时查一次，用户要等到点按钮才发现，还会看到误导性的错误。
async function ping(){
  let ok=false;
  try{ const r=await fetch('/health',{cache:'no-store'}); ok=r.ok && (await r.json()).ok; }
  catch(e){ ok=false; }
  if(ok!==ONLINE){
    ONLINE=ok;
    $('#conn').querySelector('.led').className='led '+(ok?'up':'down');
    $('#connTxt').textContent=ok?'服务已连接':'服务未运行';
    $('#conn').title=ok?'':'在终端运行：python3 web/server.py';
    if(ok){
      try{
        CFG=await (await fetch('/api/config',{cache:'no-store'})).json();
        $('#rw').disabled=!CFG.llm_configured;
        $('#rw').title=CFG.llm_configured?('模型：'+CFG.llm_model)
          :'未配置 LLM：设置 LLM_BASE_URL 与 LLM_API_KEY 后重启服务';
        $('#cal').textContent=(CFG.calibrated?'权重已标定':'权重未标定')
          +' · '+(CFG.llm_configured?('LLM '+CFG.llm_model):'LLM 未配置');
      }catch(e){}
      // 服务恢复后清掉之前的断线提示
      const w=$('#out').querySelector('.warn');
      if(w && w.textContent.includes('连接失败'))
        $('#out').innerHTML='<div class="empty">服务已恢复，可以重新诊断。</div>';
    }else{
      $('#rw').disabled=true;
      $('#cal').textContent='';
    }
  }
}
ping(); setInterval(ping, 4000);

inp.oninput=()=>{$('#cnt').textContent=inp.value.replace(/\s/g,'').length+' 字'};
$('#rw').onclick=pipeline;
$('#demo').onclick=()=>{inp.value=DEMO;inp.dispatchEvent(new Event('input'));run()};
$('#btn').onclick=run; $('#fix').onclick=autofix;
$('#file').onchange=e=>{ onFile(e.target.files[0]); e.target.value=''; };
$('#exp').onclick=exportDocx;
// 整页拖放：拖一个 .docx 进来就直接载入
document.addEventListener('dragover',e=>{e.preventDefault()});
document.addEventListener('drop',e=>{
  e.preventDefault();
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f) onFile(f);
});
inp.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')run()});

async function post(url,body){
  let r;
  try{
    r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }catch(e){
    throw new Error('NET|连不上本地服务。最常见的原因是**服务没在运行**——'
      +'这个页面可能是之前开的，而终端里的 server.py 已经停掉了。\n\n'
      +'在项目目录运行：python3 web/server.py\n\n'
      +'服务起来后本页会自动恢复（右上角的灯会变绿），不用刷新。'
      +'若你开着代理软件，还需把 127.0.0.1 和 localhost 加入绕过列表。');
  }
  const raw=await r.text();
  let data=null; try{ data=JSON.parse(raw); }catch(e){}
  if(!data){
    // 返回的不是 JSON —— 几乎总是代理插在中间返回了错误页
    throw new Error('NET|收到的不是本服务的响应（HTTP '+r.status+'）。'
      +'多半是代理软件拦截了 127.0.0.1，请把它加入绕过列表后重试。');
  }
  if(!r.ok) throw new Error((data.error||r.statusText)+(data.detail?'：'+data.detail:''));
  return data;
}
// 原始 docx 字节由页面保管并在导出时回传，服务端不存会话状态。
let DOCX=null, DOCX_NAME='';

function renderNotices(list){
  const box=$('#notices');
  if(!list||!list.length){ box.innerHTML=''; return; }
  box.innerHTML=list.map(n=>
    `<div class="notice ${n.level==='warn'?'warn':'info'}">${n.text.replace(/\n/g,'<br>')}</div>`
  ).join('');
}

function b64(buf){
  // 大文件不能用 apply(...spread)，参数个数会爆栈，必须分块
  const b=new Uint8Array(buf); let out='';
  for(let i=0;i<b.length;i+=0x8000) out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(out);
}

async function onFile(f){
  if(!f) return;
  if(!/\.docx$/i.test(f.name)){
    return showErr(new Error('只支持 .docx。如果是 .doc 旧格式，请在 Word 里另存为 .docx。'));
  }
  busy(true,'解析文档');
  try{
    DOCX=b64(await f.arrayBuffer()); DOCX_NAME=f.name;
    const r=await post('/api/docx/extract',{file:DOCX});
    $('#in').value=r.text;
    $('#in').dispatchEvent(new Event('input'));
    renderNotices(r.notices);
    $('#docinfo').hidden=false;
    $('#docinfo').innerHTML=`已载入 <b>${f.name}</b>：${r.meta.n_paragraphs} 段、`
      +`${r.meta.n_chars} 字。修复或改写之后可以<b>导出 docx</b>——`
      +`只替换文字命中的那些段落，字体、样式、图表、页眉页脚全部保留。`;
    $('#exp').hidden=false;
    await run();
  }catch(e){ showErr(e); }
  finally{ busy(false); }
}

async function exportDocx(){
  if(!DOCX) return;
  busy(true,'导出中');
  try{
    const r=await post('/api/docx/export',{file:DOCX,text:$('#in').value});
    const bin=atob(r.file), arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],
      {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
    const a=document.createElement('a');
    a.href=url; a.download=DOCX_NAME.replace(/\.docx$/i,'')+'_已修改.docx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ showErr(e); }
  finally{ busy(false); }
}

function showErr(e){
  const net=e.message.startsWith('NET|');
  const msg=net?e.message.slice(4):e.message;
  $('#out').innerHTML=`<div class="warn" style="margin:0">
      <b>${net?'连接失败':'处理失败'}</b>
      <div style="margin-top:6px;white-space:pre-wrap">${msg.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>
      ${net?'':'<div style="margin-top:8px;font-size:12px;opacity:.8">'
        +'运行 server.py 的终端里会有完整报错，把它发我即可定位。</div>'}
    </div>`;
}

function busy(on,label){
  $('#btn').disabled=on||ONLINE===false;
  $('#fix').disabled=on||!cur||ONLINE===false;
  $('#rw').disabled=on||!CFG.llm_configured||ONLINE===false;
  const ex=$('#exp'); if(ex) ex.disabled=on||ONLINE===false;
  $('#btn').innerHTML=on?`<span class="spin"></span> ${label||'诊断中'}`:'诊断';
}

async function run(){
  const t=inp.value.trim(); if(!t) return;
  busy(true);
  try{ cur=await post('/api/diagnose',{text:t}); curText=cur.text; render(cur,curText);
       $('#cal').textContent=cur.calibrated?'权重：已标定':'权重：临时值（未经探测标定）';
  }catch(e){ showErr(e); }
  busy(false); $('#fix').disabled=!cur;
}

async function autofix(){
  const t=inp.value.trim(); if(!t) return;
  busy(true,'修复中');
  try{
    const r=await post('/api/autofix',{text:t});
    renderFix(r);
  }catch(e){ showErr(e); }
  busy(false);
}

async function pipeline(){
  const t=inp.value.trim(); if(!t) return;
  busy(true,'两层处理中');
  try{ renderPipe(await post('/api/rewrite',{text:t,n:3})); }
  catch(e){ showErr(e); }
  busy(false);
}

function renderPipe(r){
  renderNotices(r.notices);
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const stage=(n,s)=>`<tr><td>${n}</td><td>${s['检出特征总数']}</td>
    <td>${s['高风险']}</td><td>${s['高风险段落']}</td><td>${s['硬约束违反']}</td></tr>`;
  let h=`<div class="tabs"><div class="tab on">两层改写结果</div></div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px">
      <thead><tr style="color:var(--muted);text-align:left">
        <th style="padding:5px 0">阶段</th><th>特征</th><th>高风险</th><th>高危段</th><th>硬约束</th>
      </tr></thead><tbody>
      ${stage('原文',r.before)}${stage('① 代码修复',r.after_codefix)}
      ${r.llm_used?stage('② LLM 改写',r.after):''}</tbody></table>`;

  if(r.code_log.length){
    h+=`<div class="note" style="border:0;margin:0 0 8px;padding:0"><b>① 代码修复</b>（毫秒级，不经模型）</div>`;
    h+=r.code_log.map(l=>`<div class="lg"><span><span class="id">${l.rule_id}</span> ${l.name}
      <span class="tag">${l.lang==='en'?'EN':'中'}</span></span><span>${l.count} 处</span></div>`).join('');
  }

  if(r.llm_used&&r.llm){
    const L=r.llm;
    h+=`<div class="note" style="border:0;margin:16px 0 8px;padding:0">
      <b>② LLM 改写</b> · 定向 ${L.n_targeted} 段，采纳 ${L.n_accepted} 段，
      未触碰 ${L.untouched} 段</div>`;
    L.paragraphs.forEach(p=>{
      h+=`<div class="f ${p.accepted?'low':'medium'}">
        <div class="t"><span class="id">第${p.index+1}段</span>
          <span class="tag">${p.lang==='en'?'EN':'中'}</span>
          ${p.targets.join(' ')}
          <span style="margin-left:auto;color:var(--${p.accepted?'lo':'md'})">
            ${p.accepted?'已采纳':'已拒绝，保留原文'}</span></div>
        <div class="e" style="margin-top:4px">${esc(p.reason)}</div>`;
      if(p.accepted){
        h+=`<div class="m" style="margin-top:7px"><s style="opacity:.55">${esc(p.original)}</s>
          <div style="margin-top:6px">${esc(p.rewritten)}</div></div>`;
      }
      if(p.candidates&&p.candidates.length>1){
        h+=`<div class="e" style="margin-top:5px">候选 ${p.candidates.length} 个：`
          +p.candidates.map((c,i)=>`#${i+1} ${c.ok?('得分 '+c.score):'作废'}`).join(' · ')+'</div>';
      }
      h+=`</div>`;
    });
  }

  h+=`<div class="note" style="margin-top:14px"><b>最终文本</b>（已写回左侧输入框）</div>
      <div class="diffbox">${esc(r.text)}</div>
      <div class="note"><b>两层都做完了，剩下的只能靠你。</b>
      代码层做减法，LLM 层重写结构，但都不会凭空造事实——
      模型只要多出一个原文没有的数字或文献，候选会被直接判废。
      真正把 AI 率压到底的那一步是<b>恢复具体性</b>：把「效果显著」换成
      「MAE 从 21.3 降到 19.8」。这个数字只有你知道。</div>`;
  $('#out').innerHTML=h;
  inp.value=r.text; inp.dispatchEvent(new Event('input'));
  cur=r.after_full; curText=r.text;
}

// 逐字符收集覆盖该位置的发现，再合并成连续区间——这样重叠命中也能正确渲染
function highlight(text,findings){
  const N=text.length, cover=Array.from({length:N},()=>[]);
  findings.forEach((f,i)=>{ for(let p=Math.max(0,f.start);p<Math.min(N,f.end);p++) cover[p].push(i); });
  const SEV={high:3,medium:2,low:1};
  let html='',run=null;
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const flush=()=>{ if(!run) return;
    const txt=esc(text.slice(run.s,run.e));
    if(!run.ids.length){ html+=txt; }
    else{ const sev=run.ids.map(i=>findings[i].severity)
            .sort((a,b)=>SEV[b]-SEV[a])[0];
          html+=`<mark class="s-${sev}" data-f="${run.ids.join(',')}">${txt}</mark>`; }
    run=null; };
  for(let p=0;p<N;p++){
    const key=cover[p].join(',');
    if(run && run.key===key){ run.e=p+1; } else { flush(); run={s:p,e:p+1,key,ids:cover[p]}; }
  }
  flush(); return html;
}

function fcard(f){
  return `<div class="f ${f.severity}" data-fi="1">
    <div class="t"><span class="id">${f.rule_id}</span>${f.name}</div>
    <div class="m">${f.matched.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>
    <div class="e">${f.explain}</div></div>`;
}

function render(r,text){
  renderNotices(r.notices);
  const s=r.summary, mz=r.metrics, me=r.metrics_en;
  const lang=s['语言构成'];
  let h=`<div class="tabs">
      <div class="tab on" data-t="doc">全文标注</div>
      <div class="tab" data-t="list">全部发现 (${r.findings.length})</div>
      <div class="tab" data-t="stat">统计指标</div></div>`;

  h+=`<div class="stats">
    <div class="stat"><div class="n">${s['总字数']}</div><div class="l">字数</div></div>
    <div class="stat"><div class="n">${s['段落数']}</div><div class="l">段落</div></div>
    <div class="stat"><div class="n hi">${s['高风险']}</div><div class="l">高风险</div></div>
    <div class="stat"><div class="n md">${s['中风险']}</div><div class="l">中风险</div></div>
    <div class="stat"><div class="n">${s['高风险段落']}</div><div class="l">高危段</div></div>
    <div class="stat"><div class="n">${lang['中文段']}/${lang['英文段']}</div><div class="l">中/英段</div></div>
  </div>`;

  if(r.hard_limit_violations.length){
    h+=`<div class="warn"><b>硬约束违反 ${r.hard_limit_violations.length} 项</b>
      <ul>${r.hard_limit_violations.map(v=>
        `<li>${v.para?('第'+v.para+'段'):'全文'}：${v.desc}（实际 ${v.actual}，上限 ${v.limit}）</li>`
      ).join('')}</ul></div>`;
  }

  h+=`<div id="pane-doc"><div id="doc">${highlight(text,r.findings)}</div>
      <div class="note" id="detail">点击带下划线的文字，看它为什么被标记。</div></div>`;

  h+=`<div id="pane-list" hidden>${
    r.findings.length?r.findings.map(fcard).join(''):'<div class="empty">没有检出特征。</div>'}</div>`;

  const f=(v)=>v===undefined||v===null?'—':v;
  h+=`<div id="pane-stat" hidden><div class="mt">`;
  if(lang['中文段']){
    h+=`<b>中文部分</b><br>
      句长均值 <b>${f(mz.sent_len_mean)}</b> · 变异系数 <b>${f(mz.sent_len_cv)}</b>
      （人类通常 >0.25）<br>
      具体性：数字密度 <b>${f(mz.digit_density)}</b>/百字 · 专名密度 <b>${f(mz.proper_density)}</b>/百字<br>
      实词密度 ${f(mz.content_ratio)} · TTR ${f(mz.ttr)} · 4-gram 重复 ${f(mz.ngram_repeat)}<br><br>`;
  }
  if(me){
    h+=`<b>English</b><br>
      Sentence length <b>${f(me.sent_len_mean)}</b> words · CV <b>${f(me.sent_len_cv)}</b><br>
      Passive voice <b>${f(me.passive_ratio)}</b> (human &lt;0.30) ·
      Hedging <b>${f(me.hedge_density)}</b> (human &lt;0.03)<br>
      TTR <b>${f(me.ttr)}</b> · Transitions ${f(me.transition_density)} ·
      Digits ${f(me.digit_density)}/100w<br><br>`;
  }
  h+=`</div><div class="note">
    <b>关于阈值。</b>规则层（上面的逐条命中）可直接核对原文，结论可证伪。
    统计层的阈值抄自公开资料且无出处，因此默认<b>只记录不告警</b>——
    在黑盒探测标定之前，拿未验证的阈值给你一个百分比，和编造没有区别。
    目前只有「数字密度」经过对照实验初步验证。</div></div>`;

  h+=`<div class="note"><b>段落一览</b>${r.paragraphs.map(p=>
    `<div class="para" data-p="${p.index}">
       <span class="dot ${p.level}"></span>
       <span class="tag">${p.lang==='en'?'EN':'中'}</span>
       <span class="p">第${p.index+1}段 · ${p.preview}…</span>
       <span class="tag">${p.raw_score} 类</span></div>`).join('')}</div>`;

  $('#out').innerHTML=h;
  wire(r,text);
}

function wire(r,text){
  $('#out').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    $('#out').querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    ['doc','list','stat'].forEach(n=>$('#pane-'+n).hidden=(n!==t.dataset.t));
  });
  $('#doc').querySelectorAll('mark').forEach(m=>m.onclick=()=>{
    $('#doc').querySelectorAll('mark').forEach(x=>x.classList.remove('sel'));
    m.classList.add('sel');
    const ids=m.dataset.f.split(',').map(Number);
    $('#detail').innerHTML=ids.map(i=>fcard(r.findings[i])).join('');
  });
  $('#out').querySelectorAll('.para').forEach(p=>p.onclick=()=>{
    const i=+p.dataset.p;
    const first=r.findings.find(f=>f.para_index===i);
    if(!first) return;
    $('#out').querySelector('.tab[data-t="doc"]').click();
    const mk=[...$('#doc').querySelectorAll('mark')]
      .find(m=>m.dataset.f.split(',').map(Number).includes(r.findings.indexOf(first)));
    if(mk){ mk.scrollIntoView({block:'center',behavior:'smooth'}); mk.click(); }
  });
}

function renderFix(r){
  renderNotices(r.notices);
  const b=r.before,a=r.after;
  const d=(k)=>`${b[k]} → <b>${a[k]}</b>`;
  let h=`<div class="tabs"><div class="tab on">确定性修复结果</div></div>
    <div class="stats">
      <div class="stat"><div class="n">${b['检出特征总数']}→${a['检出特征总数']}</div><div class="l">特征总数</div></div>
      <div class="stat"><div class="n hi">${b['高风险']}→${a['高风险']}</div><div class="l">高风险</div></div>
      <div class="stat"><div class="n">${b['高风险段落']}→${a['高风险段落']}</div><div class="l">高危段</div></div>
      <div class="stat"><div class="n">${b['硬约束违反']}→${a['硬约束违反']}</div><div class="l">硬约束</div></div>
    </div>
    <div class="note" style="border:0;margin:0 0 12px;padding:0"><b>改动明细</b></div>`;
  h+=r.log.map(l=>`<div class="lg"><span><span class="id" style="font:11.5px ui-monospace,monospace">${l.rule_id}</span> ${l.name}</span><span>${l.count} 处</span></div>`).join('');
  h+=`<div class="note" style="margin-top:14px"><b>修复后文本</b>（已复制到左侧输入框，可再次诊断）</div>
      <div class="diffbox">${r.fixed_text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>
      <div class="note"><b>剩下的需要你来。</b>确定性修复只能做减法。
      真正把 AI 率降下去最有效的一步是<b>恢复具体性</b>——把「效果显著」换成
      「MAE 从 21.3 降到 19.8」。这类信息只能来自你本人，工具不应当替你编造。</div>`;
  $('#out').innerHTML=h;
  inp.value=r.fixed_text; inp.dispatchEvent(new Event('input'));
  cur=r.after_full; curText=r.fixed_text;
}
</script></body></html>
