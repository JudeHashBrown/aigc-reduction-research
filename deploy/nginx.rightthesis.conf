limit_req_zone $binary_remote_addr zone=rightthesis_traffic:10m rate=120r/m;

server {
    listen 80;
    server_name rightthesis.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rightthesis.com;

    ssl_certificate /etc/letsencrypt/live/rightthesis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rightthesis.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    location = /api/traffic/page-view {
        limit_req zone=rightthesis_traffic burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:8877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
